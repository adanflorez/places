<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Palatin — Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <h1>The Palatin</h1>
            <p>Panel de administración</p>

            <div id="alert" class="alert alert-error" style="display:none"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="admin@palatin.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
                    Ingresar
                </button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Si ya está logueado, redirigir al dashboard
        if (Auth.isLogged()) window.location.href = 'dashboard.html';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alert = document.getElementById('alert');
            alert.style.display = 'none';

            const data = await api('POST', '/auth/login.php', {
                email:    document.getElementById('email').value,
                password: document.getElementById('password').value,
            });

            if (data?.token) {
                Auth.save(data.token, data.user);
                window.location.href = 'dashboard.html';
            } else {
                alert.textContent = data?.error || 'Error al iniciar sesión';
                alert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
