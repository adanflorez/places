<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lugar — The Palatin Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="admin-layout">
        <div id="sidebar"></div>

        <div class="main-content">
            <div class="topbar">
                <div>
                    <h2 id="pageTitle">Nuevo lugar</h2>
                    <small><a href="places.html" style="color:#888">← Volver a lugares</a></small>
                </div>
            </div>

            <div class="page">
                <div id="alert" class="alert" style="display:none"></div>

                <form class="form-card" id="placeForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre del lugar</label>
                            <input type="text" id="name" required placeholder="Villa en la playa">
                        </div>
                        <div class="form-group">
                            <label>Slug (URL)</label>
                            <input type="text" id="slug" required placeholder="villa-en-la-playa">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="description" required placeholder="Describe el lugar..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Precio por noche (USD)</label>
                            <input type="number" id="price_per_night" required min="1" step="0.01" placeholder="150">
                        </div>
                        <div class="form-group">
                            <label>Máximo de huéspedes</label>
                            <input type="number" id="max_guests" required min="1" max="30" placeholder="6">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Ubicación</label>
                        <input type="text" id="location" required placeholder="Cartagena, Colombia">
                    </div>

                    <div class="form-group">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
                            <label style="margin:0">Amenidades</label>
                            <button type="button" class="btn btn-sm btn-secondary" onclick="toggleAddAmenity()">+ Nueva amenidad</button>
                        </div>
                        <div class="amenities-grid" id="amenitiesGrid">Cargando...</div>

                        <!-- Panel para agregar nueva amenidad -->
                        <div class="add-amenity-panel" id="addAmenityPanel">
                            <p style="font-size:.8rem;color:#888;margin-bottom:.5rem">Selecciona un ícono y escribe el nombre:</p>
                            <div class="icon-picker" id="iconPicker"></div>
                            <div style="display:flex;gap:.5rem;margin-top:.5rem">
                                <input id="newAmenityName" type="text" class="form-control" placeholder="Nombre de la amenidad" style="flex:1">
                                <button type="button" class="btn btn-primary" onclick="saveNewAmenity()">Agregar</button>
                                <button type="button" class="btn" style="background:#eee;color:#333" onclick="toggleAddAmenity()">Cancelar</button>
                            </div>
                            <div id="amenityAlert" class="alert" style="display:none;margin-top:.5rem"></div>
                        </div>
                    </div>

                    <div style="display:flex;gap:.75rem;margin-top:1rem">
                        <button type="submit" class="btn btn-primary">Guardar lugar</button>
                        <a href="places.html" class="btn" style="background:#eee;color:#333">Cancelar</a>
                    </div>
                </form>

                <!-- Sección de imágenes: solo visible al editar -->
                <div id="imagesSection" style="display:none;margin-top:2rem" class="form-card">
                    <h3 style="font-size:1rem;font-weight:600;margin-bottom:1.2rem">Imágenes del lugar</h3>

                    <!-- Subir nueva imagen -->
                    <div class="form-group" style="display:flex;gap:.75rem;align-items:flex-end">
                        <div style="flex:1">
                            <label>Subir imagen <span style="color:#aaa;font-weight:400">(JPG, PNG o WebP — máx. 5 MB)</span></label>
                            <input type="file" id="imageFile" accept="image/jpeg,image/png,image/webp">
                        </div>
                        <button type="button" class="btn btn-primary" onclick="uploadImage()">Subir</button>
                    </div>
                    <div id="uploadAlert" class="alert" style="display:none"></div>

                    <!-- Galería de imágenes actuales -->
                    <div id="imagesGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-top:1rem"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        Auth.require();

        fetch('sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar').innerHTML = html;
            document.querySelector('[data-page="places"]')?.classList.add('active');
        });

        const params  = new URLSearchParams(location.search);
        const placeId = params.get('id');
        if (placeId) document.getElementById('pageTitle').textContent = 'Editar lugar';

        // Generar slug automático desde el nombre
        document.getElementById('name').addEventListener('input', e => {
            if (!placeId) {
                document.getElementById('slug').value = e.target.value
                    .toLowerCase().trim()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9\s-]/g, '')
                    .replace(/\s+/g, '-');
            }
        });

        // Íconos disponibles para amenidades
        const AMENITY_ICONS = [
            'fa fa-wifi','fa fa-car','fa fa-bath','fa fa-snowflake-o','fa fa-fire',
            'fa fa-television','fa fa-cutlery','fa fa-coffee','fa fa-tint','fa fa-bolt',
            'fa fa-paw','fa fa-bicycle','fa fa-ship','fa fa-bed','fa fa-home',
            'fa fa-umbrella','fa fa-sun-o','fa fa-tree','fa fa-music','fa fa-gamepad',
            'fa fa-bell','fa fa-star','fa fa-map-marker','fa fa-phone',
            'fa fa-lock','fa fa-shield','fa fa-plus-square','fa fa-flag',
        ];
        let selectedIcon = AMENITY_ICONS[0];

        function buildIconPicker() {
            const picker = document.getElementById('iconPicker');
            picker.innerHTML = AMENITY_ICONS.map(ic => `
                <div class="icon-option ${ic === selectedIcon ? 'active' : ''}" title="${ic}" onclick="selectIcon('${ic}',this)">
                    <i class="${ic}"></i>
                </div>`).join('');
        }

        function selectIcon(icon, el) {
            selectedIcon = icon;
            document.querySelectorAll('.icon-option').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleAddAmenity() {
            const panel = document.getElementById('addAmenityPanel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                buildIconPicker();
                document.getElementById('newAmenityName').focus();
            }
        }

        async function saveNewAmenity() {
            const name    = document.getElementById('newAmenityName').value.trim();
            const alertEl = document.getElementById('amenityAlert');
            if (!name) { alertEl.textContent='Escribe un nombre'; alertEl.className='alert alert-error'; alertEl.style.display='block'; return; }

            const data = await api('POST', '/places/amenities.php', { name, icon: selectedIcon });
            if (data?.error) {
                alertEl.textContent = data.error; alertEl.className = 'alert alert-error'; alertEl.style.display = 'block';
                return;
            }
            // Agregar al grid con checkbox marcado
            const grid  = document.getElementById('amenitiesGrid');
            const label = document.createElement('label');
            label.className = 'amenity-check';
            label.innerHTML = `<input type="checkbox" name="amenity" value="${data.id}" checked><i class="${data.icon}"></i> ${data.name}`;
            grid.appendChild(label);

            document.getElementById('newAmenityName').value = '';
            alertEl.style.display = 'none';
            document.getElementById('addAmenityPanel').classList.remove('open');
        }

        // Cargar amenidades
        async function loadAmenities(selected = []) {
            const amenities = await api('GET', '/places/amenities.php');
            const grid = document.getElementById('amenitiesGrid');
            grid.innerHTML = (amenities ?? []).map(a => `
                <label class="amenity-check">
                    <input type="checkbox" name="amenity" value="${a.id}" ${selected.includes(a.id) ? 'checked' : ''}>
                    <i class="${a.icon}"></i> ${a.name}
                </label>
            `).join('');
        }

        // Si es edición, cargar datos del lugar
        async function loadPlace() {
            if (!placeId) { await loadAmenities(); return; }

            const place = await api('GET', `/places/index.php?id=${placeId}`);
            if (!place?.id) return;

            document.getElementById('name').value            = place.name;
            document.getElementById('slug').value            = place.slug;
            document.getElementById('description').value     = place.description;
            document.getElementById('price_per_night').value = place.price_per_night;
            document.getElementById('max_guests').value      = place.max_guests;
            document.getElementById('location').value        = place.location;

            const selectedIds = (place.amenities ?? []).map(a => a.id);
            await loadAmenities(selectedIds);
        }

        // Mostrar sección de imágenes y cargarlas si es edición
        async function loadImages() {
            if (!placeId) return;
            document.getElementById('imagesSection').style.display = 'block';

            const place = await api('GET', `/places/index.php?id=${placeId}`);
            renderImages(place?.images ?? []);
        }

        function renderImages(images) {
            const grid = document.getElementById('imagesGrid');
            if (images.length === 0) {
                grid.innerHTML = '<p style="color:#aaa;font-size:.875rem">No hay imágenes aún. Sube la primera.</p>';
                return;
            }
            grid.innerHTML = images.map(img => `
                <div style="position:relative;border-radius:8px;overflow:hidden;border:2px solid ${img.is_cover ? 'var(--primary)' : '#eee'}">
                    <img src="/${img.url}" style="width:100%;height:120px;object-fit:cover;display:block">
                    <div style="padding:.5rem;background:#fff;display:flex;gap:.35rem;flex-wrap:wrap">
                        ${!img.is_cover ? `<button onclick="setCover(${img.id})" class="btn btn-sm btn-primary" style="flex:1;justify-content:center">Portada</button>` : `<span style="font-size:.75rem;color:var(--primary);font-weight:600;padding:.3rem 0">Portada actual</span>`}
                        <button onclick="deleteImage(${img.id})" class="btn btn-sm btn-danger" style="flex:1;justify-content:center">Eliminar</button>
                    </div>
                </div>`).join('');
        }

        async function uploadImage() {
            const file      = document.getElementById('imageFile').files[0];
            const alertEl   = document.getElementById('uploadAlert');
            alertEl.style.display = 'none';

            if (!file) { showUploadAlert('Selecciona una imagen primero', 'error'); return; }

            const formData = new FormData();
            formData.append('image', file);
            formData.append('place_id', placeId);

            const headers = {};
            const token   = Auth.getToken();
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const res  = await fetch(`${API_BASE}/places/images.php`, { method: 'POST', headers, body: formData });
            const data = await res.json();

            if (data?.error) {
                showUploadAlert(data.error, 'error');
            } else {
                document.getElementById('imageFile').value = '';
                showUploadAlert('Imagen subida correctamente', 'success');
                loadImages();
            }
        }

        async function setCover(imageId) {
            await api('PUT', `/places/images.php?id=${imageId}`);
            loadImages();
        }

        async function deleteImage(imageId) {
            if (!confirm('¿Eliminar esta imagen?')) return;
            await api('DELETE', `/places/images.php?id=${imageId}`);
            loadImages();
        }

        function showUploadAlert(msg, type) {
            const el = document.getElementById('uploadAlert');
            el.textContent   = msg;
            el.className     = `alert alert-${type}`;
            el.style.display = 'block';
        }

        loadPlace();
        loadImages();

        document.getElementById('placeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertEl = document.getElementById('alert');
            alertEl.style.display = 'none';

            const amenities = [...document.querySelectorAll('input[name="amenity"]:checked')]
                .map(el => parseInt(el.value));

            const body = {
                name:            document.getElementById('name').value,
                slug:            document.getElementById('slug').value,
                description:     document.getElementById('description').value,
                price_per_night: parseFloat(document.getElementById('price_per_night').value),
                max_guests:      parseInt(document.getElementById('max_guests').value),
                location:        document.getElementById('location').value,
                amenities,
            };

            const method = placeId ? 'PUT' : 'POST';
            const path   = placeId ? `/places/index.php?id=${placeId}` : '/places/index.php';
            const data   = await api(method, path, body);

            if (data?.error) {
                alertEl.textContent    = data.error;
                alertEl.className      = 'alert alert-error';
                alertEl.style.display  = 'block';
            } else {
                alertEl.textContent    = data?.message ?? 'Guardado correctamente';
                alertEl.className      = 'alert alert-success';
                alertEl.style.display  = 'block';
                setTimeout(() => window.location.href = 'places.html', 1200);
            }
        });
    </script>
</body>
</html>
